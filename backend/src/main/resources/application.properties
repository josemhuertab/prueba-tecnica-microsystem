# =============================================
# Configuración principal de la aplicación
# =============================================

server.port=8080

# Base de datos SQLite
spring.datasource.url=jdbc:sqlite:./data/microsystem.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# CORS - permite peticiones desde el frontend Vue
spring.web.cors.allowed-origins=http://localhost:5173

# Clave secreta para firmar los JWT (en producción usar variable de entorno)
jwt.secret=MicrosystemPortalSecretKey2024SuperSegura
jwt.expiration=86400000
